[project]
name = "delta-tts"
version = "1.0.0"
description = "DELTA-TTS: Adapting Autoregressive Model into Diffusion Language Model for Text-to-Speech"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
# Versions match the environment used for the paper.
dependencies = [
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
    "transformers==4.51.3",
    "peft==0.18.1",
    "huggingface-hub==0.36.2",
    "numpy==2.4.3",
    "scipy==1.17.1",
    "soundfile==0.13.1",
    "librosa==0.11.0",
    "tqdm",
    # CosyVoice 3 (frontend, flow-matching decoder, vocoder)
    "hyperpyyaml==1.2.3",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "onnxruntime-gpu==1.24.4",
    "openai-whisper==20250625",
    "wetext==0.1.2",
    "inflect==7.5.0",
    "conformer==0.3.2",
    "diffusers==0.37.0",
    "x-transformers==2.17.7",
    "einops==0.8.2",
    "lightning==2.6.1",
    "modelscope==1.35.1",
    "pyworld==0.3.5",
    "pyarrow==23.0.1",
    "matplotlib==3.10.8",
    "rich",
    "gdown",
    "wget",
    "setuptools<70",
]

[tool.uv]
package = false
